          description: ''
  /v1/share/{study}/users/:
    get:
      operationId: v1_share_users_retrieve
      description: A QR code linking to this study
      parameters:
      - in: path
        name: study
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Share
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/svg+xml:
              schema:
                type: string
          description: ''
  /v1/studies/:
    get:
      operationId: v1_studies_list
      tags:
      - Study
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyList'
          description: ''
  /v1/studies/{id}/:
    get:
      operationId: v1_studies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this study.
        required: true
      tags:

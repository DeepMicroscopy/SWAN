components:
  schemas:
    BlankEnum:
      enum:
      - ''
    ChoiceEnum:
      enum:
      - up
      - down
      - left
      - right
      type: string
      description: |-
        * `up` - up
        * `down` - down
        * `left` - left
        * `right` - right
    ClassifyInput:
      type: object
      properties:
        study:
          type: string
          format: uuid
        choice:
          $ref: '#/components/schemas/ChoiceEnum'
        index:
          type: integer
      required:
      - choice
      - index
      - study
    ClassifyOutput:
      type: object
      properties:
        study:
          type: string
          format: uuid
        choice:
          type: string
        index:
          type: integer
        education:
          allOf:
          - $ref: '#/components/schemas/Education'
          readOnly: true
          nullable: true
      required:
      - choice
      - education
      - index
      - study
    Dataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          description: Only used for display purposes in the study creation.
          maxLength: 200
        archive:
          type: string
          format: uri
          description: The dataset archive. Files are registered by their full path
            inside the archive.
        file_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: The number of files in the dataset. Calculated automatically.
        file_list:
          nullable: true
          description: A list of all files in the dataset. Calculated automatically.
      required:
      - archive
      - id
      - title
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Education:
      type: object
      properties:
        solution:
          $ref: '#/components/schemas/Solution'
        proof:
          type: string
          nullable: true
      required:
      - proof
      - solution
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    InfoRequest:
      type: object
      properties:
        intro_general:
          type: integer
        intro_swiping:
          type: integer
    InfoResponse:
      type: object
      properties:
        intro_general:
          type: integer
        intro_swiping:
          type: integer
      required:
      - intro_general
      - intro_swiping
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    NullEnum:
      enum:
      - null
    PostponeEnum:
      enum:
      - left
      - right
      - up
      - down
      type: string
      description: |-
        * `left` - left
        * `right` - right
        * `up` - up
        * `down` - down
    Postponed:
      type: object
      properties:
        images:
          type: array
          items:
            type: integer
      required:
      - images
    Solution:
      type: object
      properties:
        text:
          type: string
      required:
      - text
    SolutionConfig:
      type: object
      properties:
        label_current:
          type: string
          nullable: true
          description: (optional) The label displayed for the classified image. Defaults
            to 'Current' in the frontend.
          maxLength: 200
        label_proof:
          type: string
          nullable: true
          description: (optional) The label displayed for the proof. Defaults to 'Proof'
            in the frontend.
          maxLength: 200
        css_row:
          type: string
          nullable: true
          description: (optional) The CSS class for the row. Overrides the frontend
            defaults.
          maxLength: 200
        css_column:
          type: string
          nullable: true
          description: (optional) The CSS class for the column. Additional modifiers
            that are added to the frontend defaults.
          maxLength: 200
    Status:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
      required:
      - authenticated
      - username
    Study:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          description: The title of the study. Visible in all interfaces.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: (optional) A short description of the study. Markdown is supported.
        image:
          type: string
          format: uri
          nullable: true
          description: (optional) A title image for the study.
        pub_date:
          type: string
          format: date-time
          title: Start
          description: The study will be visible on the overview at this time.
        end_date:
          type: string
          format: date-time
          title: End
          description: The study will be removed from the overview at this time.
        educational:
          type: boolean
          readOnly: true
        length:
          type: integer
        index:
          type: integer
          readOnly: true
        solution:
          allOf:
          - $ref: '#/components/schemas/SolutionConfig'
          nullable: true
        ui:
          $ref: '#/components/schemas/Ui'
      required:
      - educational
      - end_date
      - id
      - index
      - length
      - pub_date
      - solution
      - title
      - ui
    StudyList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          description: The title of the study. Visible in all interfaces.
          maxLength: 200
        description:
          type: string
          nullable: true
          description: (optional) A short description of the study. Markdown is supported.
        image:
          type: string
          format: uri
          nullable: true
          description: (optional) A title image for the study.
        pub_date:
          type: string
          format: date-time
          title: Start
          description: The study will be visible on the overview at this time.
        end_date:
          type: string
          format: date-time
          title: End
          description: The study will be removed from the overview at this time.
        educational:
          type: boolean
          readOnly: true
        length:
          type: integer
        index:
          type: integer
          readOnly: true
      required:
      - educational
      - end_date
      - id
      - index
      - length
      - pub_date
      - title
    Ui:
      type: object
      properties:
        title:
          type: string
          description: Only used for display purposes in the study creation.
          maxLength: 200
        labels:
          $ref: '#/components/schemas/UiLabel'
        postpone:
          nullable: true
          description: |-
            (optional) The direction to mark images for another round of classification.

            * `left` - left
            * `right` - right
            * `up` - up
            * `down` - down
          oneOf:
          - $ref: '#/components/schemas/PostponeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        pixelated:
          type: boolean
          description: Use 'pixelated' image-rendering.
        default_scale:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: The default scale of images in the study. Values in percent.
      required:
      - labels
      - title
    UiDirection:
      type: object
      properties:
        text:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
      required:
      - color
      - icon
      - text
    UiLabel:
      type: object
      properties:
        left:
          allOf:
          - $ref: '#/components/schemas/UiDirection'
          nullable: true
        right:
          allOf:
          - $ref: '#/components/schemas/UiDirection'
          nullable: true
        up:
          allOf:
          - $ref: '#/components/schemas/UiDirection'
          nullable: true
        down:
          allOf:
          - $ref: '#/components/schemas/UiDirection'
          nullable: true
      required:
      - down
      - left
      - right
      - up
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

  /v1/classify/:
    post:
      operationId: v1_classify_create
      tags:
      - Classify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassifyInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassifyInput'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyOutput'
          description: ''
  /v1/classify/{id}/{index}/:
    get:
      operationId: v1_classify_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this study.
        required: true
      - in: path
        name: index
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Classify
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyOutput'
          description: ''
  /v1/datasets/:
    get:
      operationId: v1_datasets_list
      tags:
      - Dataset
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dataset'
          description: ''
  /v1/datasets/{id}/:
    get:
      operationId: v1_datasets_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dataset.
        required: true
      tags:
      - Dataset
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
          description: ''
  /v1/datasets/{id}/{index}/:
    get:
      operationId: v1_datasets_retrieve_entry
      description: The file at the index of the dataset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dataset.
        required: true
      - in: path
        name: index
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Dataset
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /v1/export/{study}/csv/:
    get:
      operationId: v1_export_csv_retrieve
      description: A QR code linking to this study
      parameters:
      - in: path
        name: study
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Export
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/svg+xml:
              schema:
                type: string
          description: ''
  /v1/share/{study}/anonymous/:
    get:
      operationId: v1_share_anonymous_retrieve
      description: A QR code linking to this study with an authorization for anonymous
        access
      parameters:
      - in: path
        name: study
        schema:
          type: string
          format: uuid
        required: true
      tags:

  /v1/studies/{id}/postponed/:
    get:
      operationId: v1_studies_postponed_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this study.
        required: true
      tags:
      - Study
      security:

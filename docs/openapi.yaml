      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InfoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InfoRequest'
      security:
      - cookieAuth: []

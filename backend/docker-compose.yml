services:

  swan:
    image: deepmicroscopy/swan:latest
    build: .
    volumes:
      - ./.media/:/media/
    environment:
      PRODUCTION: "false"
      ALLOWED_HOSTS: "localhost"
      MEDIA_ROOT: "/media/"
      DATABASE_URL: "postgres://swan:swan@postgres:5432/swan"
    ports:
      - "127.0.0.1:8000:5000"

  postgres:
    image: postgres:17.5-alpine3.22
    restart: always
    environment:
      POSTGRES_DB: "swan"
      POSTGRES_USER: "swan"
      POSTGRES_PASSWORD: "swan"
    ports:
      - "127.0.0.1:5432:5432"